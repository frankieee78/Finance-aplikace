<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#0F1F3D"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Osobní finance"/>
<title>Osobní finance</title>
<template id="__bundler_thumbnail">
<svg viewBox="0 0 80 56" xmlns="http://www.w3.org/2000/svg">
  <rect width="80" height="56" fill="#0F1F3D"/>
  <rect x="16" y="10" width="48" height="36" rx="6" fill="#1a2f57"/>
  <rect x="22" y="16" width="28" height="4" rx="2" fill="#1DB97A"/>
  <text x="40" y="50" text-anchor="middle" font-size="5" fill="rgba(255,255,255,0.5)" font-family="sans-serif">Osobní finance</text>
</svg>
</template>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body,#root{height:100%;width:100%;overflow:hidden;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0F1F3D;overscroll-behavior:none;-webkit-overflow-scrolling:touch;}
::-webkit-scrollbar{display:none;}
@keyframes bounce{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-5px);}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@keyframes pop{0%{transform:scale(0.9);opacity:0;}100%{transform:scale(1);opacity:1;}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

// ══════════════════════════════════════════════════════════════
// CONSTANTS
// ══════════════════════════════════════════════════════════════
const NAVY='#0F1F3D', NAVY2='#1a2f57';
const AC={main:'#1DB97A',light:'#e8faf3',dark:'#168a5a',muted:'rgba(29,185,122,0.15)'};
const safeTop='env(safe-area-inset-top,0px)', safeBot='env(safe-area-inset-bottom,0px)';
const hPad=`calc(${safeTop} + 52px)`;

// ══════════════════════════════════════════════════════════════
// STORAGE HELPERS
// ══════════════════════════════════════════════════════════════
const LS = {
  get:(k,def=null)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch{return def;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}},
  key:(user,k)=>`of_${user}_${k}`,
};

// ══════════════════════════════════════════════════════════════
// SHARED UI
// ══════════════════════════════════════════════════════════════
function Card({style,children,onClick}){
  return <div onClick={onClick} style={{background:'#fff',borderRadius:20,padding:'18px',boxShadow:'0 2px 12px rgba(0,0,0,0.06)',...style}}>{children}</div>;
}
function PBar({value,max,color,height=8}){
  const p=Math.min(100,(value/max)*100);
  return <div style={{background:'#f0f0f0',borderRadius:99,height,overflow:'hidden'}}>
    <div style={{width:p+'%',height:'100%',background:color,borderRadius:99,transition:'width .6s ease'}}/>
  </div>;
}
function Btn({children,onClick,style,disabled,variant='primary'}){
  const base={border:'none',borderRadius:16,padding:'16px',fontSize:15,fontWeight:700,fontFamily:'inherit',cursor:disabled?'default':'pointer',transition:'opacity .15s',...style};
  const vs={
    primary:{background:AC.main,color:'#fff',boxShadow:`0 8px 24px ${AC.muted}`,opacity:disabled?.5:1},
    secondary:{background:'#f0f2f5',color:NAVY},
    outline:{background:'transparent',border:`1.5px solid ${AC.main}`,color:AC.main},
  };
  return <button onClick={disabled?undefined:onClick} style={{...base,...vs[variant]}}>{children}</button>;
}
function Input({label,value,onChange,type='text',placeholder}){
  const [focus,setFocus]=React.useState(false);
  return <div>
    {label&&<label style={{fontSize:12,fontWeight:600,color:'#888',display:'block',marginBottom:6,textTransform:'uppercase',letterSpacing:.5}}>{label}</label>}
    <input value={value} onChange={e=>onChange(e.target.value)} type={type} placeholder={placeholder}
      onFocus={()=>setFocus(true)} onBlur={()=>setFocus(false)}
      style={{width:'100%',background:'#fff',borderRadius:14,padding:'14px 16px',border:`1.5px solid ${focus?AC.main:'#e8ecf2'}`,fontSize:15,color:NAVY,fontFamily:'inherit',outline:'none',transition:'border-color .2s'}}/>
  </div>;
}

// ══════════════════════════════════════════════════════════════
// TAB BAR — 6 záložek
// ══════════════════════════════════════════════════════════════
function TabBar({active,onTab}){
  const tabs=[
    {id:'dash',label:'Přehled'},
    {id:'expenses',label:'Výdaje'},
    {id:'budget',label:'Rozpočet'},
    {id:'portfolio',label:'Portfolio'},
    {id:'savings',label:'Cíle'},
    {id:'learn',label:'Učení'},
  ];
  return <div style={{display:'flex',background:'#fff',borderTop:'1px solid rgba(0,0,0,0.07)',paddingTop:8,paddingBottom:`calc(${safeBot} + 4px)`,flexShrink:0}}>
    {tabs.map(t=>{
      const on=active===t.id;
      return <button key={t.id} onClick={()=>onTab(t.id)} style={{flex:1,border:'none',background:'transparent',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:2,padding:'3px 0'}}>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          {t.id==='dash'&&<><rect x="3" y="3" width="8" height="8" rx="2.5" fill={on?AC.main:'#c0c8d8'}/><rect x="13" y="3" width="8" height="8" rx="2.5" fill={on?AC.main:'#c0c8d8'} opacity=".6"/><rect x="3" y="13" width="8" height="8" rx="2.5" fill={on?AC.main:'#c0c8d8'} opacity=".6"/><rect x="13" y="13" width="8" height="8" rx="2.5" fill={on?AC.main:'#c0c8d8'}/></>}
          {t.id==='expenses'&&<path d="M21 7H3M21 12H3M21 17H3" stroke={on?AC.main:'#c0c8d8'} strokeWidth="2" strokeLinecap="round"/>}
          {t.id==='budget'&&<><circle cx="12" cy="12" r="9" stroke={on?AC.main:'#c0c8d8'} strokeWidth="2"/><path d="M12 6v6l4 2" stroke={on?AC.main:'#c0c8d8'} strokeWidth="2" strokeLinecap="round"/></>}
          {t.id==='portfolio'&&<><path d="M3 17l4-4 4 4 4-5 4 3" stroke={on?AC.main:'#c0c8d8'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/><rect x="3" y="3" width="18" height="16" rx="2" stroke={on?AC.main:'#c0c8d8'} strokeWidth="2"/></>}
          {t.id==='savings'&&<path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6L12 2z" fill={on?AC.main:'#c0c8d8'}/>}
          {t.id==='learn'&&<><path d="M12 3L2 8l10 5 10-5-10-5z" fill={on?AC.main:'#c0c8d8'}/><path d="M7 10.5v5.5a5 5 0 0010 0v-5.5" stroke={on?AC.main:'#c0c8d8'} strokeWidth="2" strokeLinecap="round"/></>}
        </svg>
        <span style={{fontSize:9,fontWeight:600,fontFamily:'inherit',color:on?AC.main:'#b0bac8',letterSpacing:.1}}>{t.label}</span>
      </button>;
    })}
  </div>;
}

// ══════════════════════════════════════════════════════════════
// ONBOARDING
// ══════════════════════════════════════════════════════════════
function OnboardingScreen({onDone}){
  const [s,setS]=React.useState(0);
  const slides=[
    {emoji:'📊',bg:AC.main,title:'Mějte přehled\no svých financích',sub:'Sledujte příjmy a výdaje na jednom místě. Jednoduše a přehledně.'},
    {emoji:'🎓',bg:NAVY,title:'Učte se finanční\ngramotnost',sub:'Kurzy, kvízy a AI poradce — staňte se pánem svých peněz.'},
    {emoji:'🎯',bg:NAVY2,title:'Dosahujte\nsvých cílů',sub:'Nastavte cíle spoření a sledujte pokrok. Každá koruna se počítá.'},
  ];
  const sl=slides[s];
  return <div style={{height:'100%',display:'flex',flexDirection:'column',background:sl.bg,transition:'background .4s ease'}}>
    <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:`calc(${safeTop}+20px) 32px 20px`,gap:32}}>
      <div style={{fontSize:90}}>{sl.emoji}</div>
      <div style={{textAlign:'center'}}>
        <h2 style={{fontSize:30,fontWeight:800,color:'#fff',lineHeight:1.2,whiteSpace:'pre-line',marginBottom:14}}>{sl.title}</h2>
        <p style={{fontSize:15,color:'rgba(255,255,255,.7)',lineHeight:1.65}}>{sl.sub}</p>
      </div>
      <div style={{display:'flex',gap:8}}>
        {slides.map((_,i)=><div key={i} onClick={()=>setS(i)} style={{width:i===s?22:7,height:7,borderRadius:99,background:i===s?'#fff':'rgba(255,255,255,.35)',transition:'all .3s ease',cursor:'pointer'}}/>)}
      </div>
    </div>
    <div style={{padding:`0 24px calc(${safeBot}+24px)`,display:'flex',flexDirection:'column',gap:12}}>
      <Btn onClick={()=>s<2?setS(s+1):onDone()} style={{width:'100%',background:'#fff',color:sl.bg}}>{s<2?'Pokračovat':'Začít zdarma'}</Btn>
      {s<2&&<button onClick={onDone} style={{background:'transparent',border:'none',fontSize:14,color:'rgba(255,255,255,.6)',cursor:'pointer',fontFamily:'inherit',padding:'8px'}}>Přeskočit</button>}
    </div>
  </div>;
}

// ══════════════════════════════════════════════════════════════
// AUTH SCREEN
// ══════════════════════════════════════════════════════════════
function AuthScreen({onLogin}){
  const [tab,setTab]=React.useState('login');
  const [name,setName]=React.useState('');
  const [email,setEmail]=React.useState('');
  const [pass,setPass]=React.useState('');
  const [err,setErr]=React.useState('');

  const doLogin=()=>{
    const users=LS.get('of_users',{});
    const u=users[email.toLowerCase()];
    if(!u){setErr('Účet neexistuje. Zaregistrujte se.');return;}
    if(u.pass!==pass){setErr('Špatné heslo.');return;}
    LS.set('of_session',{email:email.toLowerCase(),name:u.name});
    onLogin({email:email.toLowerCase(),name:u.name});
  };
  const doRegister=()=>{
    if(!name||!email||!pass){setErr('Vyplňte všechna pole.');return;}
    if(pass.length<6){setErr('Heslo musí mít alespoň 6 znaků.');return;}
    const users=LS.get('of_users',{});
    if(users[email.toLowerCase()]){setErr('Tento e-mail je již registrován.');return;}
    users[email.toLowerCase()]={name,pass};
    LS.set('of_users',users);
    LS.set('of_session',{email:email.toLowerCase(),name});
    onLogin({email:email.toLowerCase(),name});
  };

  return <div style={{height:'100%',display:'flex',flexDirection:'column',background:'#f7f9fc',overflowY:'auto',WebkitOverflowScrolling:'touch'}}>
    <div style={{padding:`${hPad} 24px 24px`,background:NAVY,flexShrink:0}}>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16}}>
        <div style={{width:40,height:40,borderRadius:14,background:AC.main,display:'flex',alignItems:'center',justifyContent:'center',fontSize:22}}>💰</div>
        <span style={{fontSize:22,fontWeight:800,color:'#fff',letterSpacing:-.3}}>Osobní finance</span>
      </div>
      <p style={{color:'rgba(255,255,255,.6)',fontSize:14,marginBottom:18}}>Spravujte peníze chytře.</p>
      <div style={{display:'flex',background:'rgba(255,255,255,.1)',borderRadius:12,padding:4}}>
        {['login','register'].map(t=>(
          <button key={t} onClick={()=>{setTab(t);setErr('');}} style={{flex:1,padding:'10px',borderRadius:9,border:'none',cursor:'pointer',background:tab===t?'#fff':'transparent',color:tab===t?NAVY:'rgba(255,255,255,.6)',fontWeight:700,fontSize:13,fontFamily:'inherit',transition:'all .2s'}}>
            {t==='login'?'Přihlášení':'Registrace'}
          </button>
        ))}
      </div>
    </div>
    <div style={{padding:'24px',display:'flex',flexDirection:'column',gap:14}}>
      {tab==='register'&&<Input label="Jméno" value={name} onChange={setName} placeholder="Jan Novák"/>}
      <Input label="E-mail" value={email} onChange={setEmail} type="email" placeholder="jan@email.cz"/>
      <Input label="Heslo" value={pass} onChange={setPass} type="password" placeholder="••••••••"/>
      {tab==='login'&&<div style={{textAlign:'right'}}><span style={{fontSize:13,color:AC.main,fontWeight:600}}>Zapomněli jste heslo?</span></div>}
      {err&&<div style={{background:'#fff0f0',border:'1px solid #ffcdd2',borderRadius:12,padding:'10px 14px',fontSize:13,color:'#c62828',fontWeight:500}}>{err}</div>}
      <Btn onClick={tab==='login'?doLogin:doRegister} style={{width:'100%',marginTop:4}}>{tab==='login'?'Přihlásit se':'Vytvořit účet'}</Btn>
      <div style={{display:'flex',alignItems:'center',gap:12,margin:'4px 0'}}>
        <div style={{flex:1,height:1,background:'#e8ecf2'}}/><span style={{fontSize:12,color:'#bbb'}}>nebo</span><div style={{flex:1,height:1,background:'#e8ecf2'}}/>
      </div>
      <button onClick={()=>{LS.set('of_session',{email:'demo@app.cz',name:'Demo uživatel'});onLogin({email:'demo@app.cz',name:'Demo uživatel'});}}
        style={{background:'#fff',border:'1.5px solid #e8ecf2',borderRadius:16,padding:'14px',fontSize:14,fontWeight:600,color:NAVY,cursor:'pointer',fontFamily:'inherit',marginBottom:20}}>
        🚀 Pokračovat jako demo
      </button>
    </div>
  </div>;
}

// ══════════════════════════════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════════════════════════════
function EmptyState({emoji,title,sub,btnLabel,onAdd}){
  return <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'48px 32px',textAlign:'center',gap:16}}>
    <div style={{fontSize:56}}>{emoji}</div>
    <div><p style={{fontSize:17,fontWeight:800,color:NAVY,marginBottom:6}}>{title}</p><p style={{fontSize:13,color:'#aaa',lineHeight:1.6}}>{sub}</p></div>
    {btnLabel&&<Btn onClick={onAdd} style={{marginTop:8}}>{btnLabel}</Btn>}
  </div>;
}

// Modal pro přidání transakce
const TXN_CATS=[
  {name:'Příjem',icon:'💼',color:'#1DB97A'},{name:'Potraviny',icon:'🛒',color:'#FF6B6B'},
  {name:'Bydlení',icon:'🏠',color:'#4f8cff'},{name:'Doprava',icon:'🚇',color:'#f5a623'},
  {name:'Zábava',icon:'🎬',color:'#9b6dff'},{name:'Zdraví',icon:'💊',color:'#26c6da'},
  {name:'Předplatné',icon:'📱',color:'#1DB954'},{name:'Oblečení',icon:'👕',color:'#ec407a'},
  {name:'Restaurace',icon:'🍕',color:'#ff7043'},{name:'Ostatní',icon:'📦',color:'#90a4ae'},
];
function AddTxnModal({onSave,onClose}){
  const [name,setName]=React.useState('');
  const [amount,setAmount]=React.useState('');
  const [cat,setCat]=React.useState(TXN_CATS[0]);
  const [type,setType]=React.useState('expense'); // income | expense
  const save=()=>{
    if(!name||!amount) return;
    const a=parseFloat(amount.replace(/\s/g,'').replace(',','.'))||0;
    onSave({name,cat:cat.name,icon:cat.icon,color:cat.color,amount:type==='income'?a:-a,date:new Date().toLocaleDateString('cs-CZ',{day:'numeric',month:'numeric'})+'.'});
  };
  return <div style={{position:'fixed',inset:0,zIndex:200,display:'flex',flexDirection:'column',justifyContent:'flex-end'}}>
    <div onClick={onClose} style={{position:'absolute',inset:0,background:'rgba(0,0,0,.5)'}}/>
    <div style={{position:'relative',background:'#f7f9fc',borderRadius:'24px 24px 0 0',padding:`20px 20px calc(${safeBot}+20px)`,display:'flex',flexDirection:'column',gap:14,maxHeight:'85vh',overflowY:'auto',WebkitOverflowScrolling:'touch'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <h3 style={{fontSize:18,fontWeight:800,color:NAVY}}>Nová transakce</h3>
        <button onClick={onClose} style={{background:'#eee',border:'none',borderRadius:99,width:32,height:32,fontSize:18,cursor:'pointer'}}>×</button>
      </div>
      {/* Typ */}
      <div style={{display:'flex',background:'rgba(0,0,0,.06)',borderRadius:12,padding:4}}>
        {[['expense','Výdaj'],['income','Příjem']].map(([v,l])=>(
          <button key={v} onClick={()=>{setType(v);if(v==='income')setCat(TXN_CATS[0]);}} style={{flex:1,padding:'9px',borderRadius:9,border:'none',cursor:'pointer',background:type===v?'#fff':'transparent',color:type===v?NAVY:'#888',fontWeight:700,fontSize:13,fontFamily:'inherit',transition:'all .2s'}}>{l}</button>
        ))}
      </div>
      <Input label="Název" value={name} onChange={setName} placeholder="Název transakce"/>
      <Input label="Částka (Kč)" value={amount} onChange={setAmount} type="text" placeholder="0"/>
      {/* Kategorie */}
      <div>
        <label style={{fontSize:12,fontWeight:600,color:'#888',display:'block',marginBottom:8,textTransform:'uppercase',letterSpacing:.5}}>Kategorie</label>
        <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
          {TXN_CATS.filter(c=>type==='income'?c.name==='Příjem':c.name!=='Příjem').map((c,i)=>(
            <button key={i} onClick={()=>setCat(c)} style={{display:'flex',alignItems:'center',gap:6,padding:'7px 12px',borderRadius:99,border:`2px solid ${cat.name===c.name?c.color:'#e8ecf2'}`,background:cat.name===c.name?c.color+'18':'#fff',fontSize:12,fontWeight:600,color:cat.name===c.name?c.color:NAVY,cursor:'pointer',fontFamily:'inherit'}}>
              <span>{c.icon}</span>{c.name}
            </button>
          ))}
        </div>
      </div>
      <Btn onClick={save} disabled={!name||!amount} style={{width:'100%'}}>Přidat transakci</Btn>
    </div>
  </div>;
}

function DashboardScreen({user,userData,setUserData,onTab}){
  const [showAddTxn,setShowAddTxn]=React.useState(false);
  const txns=userData.transactions||[];
  const income=txns.filter(t=>t.amount>0).reduce((s,t)=>s+t.amount,0);
  const expenses=txns.filter(t=>t.amount<0).reduce((s,t)=>s+Math.abs(t.amount),0);
  const balance=income-expenses;
  const firstName=user.name.split(' ')[0];

  const addTxn=(t)=>{
    const updated={...userData,transactions:[t,...txns]};
    setUserData(updated);
    LS.set(LS.key(user.email,'data'),updated);
    setShowAddTxn(false);
  };

  return <div style={{height:'100%',display:'flex',flexDirection:'column',background:'#f7f9fc'}}>
    {showAddTxn&&<AddTxnModal onSave={addTxn} onClose={()=>setShowAddTxn(false)}/>}
    <div style={{flex:1,overflowY:'auto',WebkitOverflowScrolling:'touch',paddingBottom:20}}>
      <div style={{background:`linear-gradient(135deg,${NAVY},${AC.dark})`,padding:`${hPad} 24px 28px`,position:'relative',overflow:'hidden'}}>
        <div style={{position:'absolute',top:-40,right:-40,width:180,height:180,borderRadius:'50%',background:'rgba(255,255,255,.05)'}}/>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:24}}>
          <div>
            <p style={{color:'rgba(255,255,255,.6)',fontSize:13,marginBottom:3}}>Dobrý den 👋</p>
            <h2 style={{color:'#fff',fontSize:22,fontWeight:800,letterSpacing:-.3}}>{user.name}</h2>
          </div>
          <div style={{width:44,height:44,borderRadius:14,background:AC.main,display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,fontWeight:800,color:'#fff'}}>
            {firstName[0]}{user.name.split(' ')[1]?.[0]||''}
          </div>
        </div>
        <div style={{background:'rgba(255,255,255,.1)',borderRadius:20,padding:'20px',backdropFilter:'blur(10px)'}}>
          <p style={{color:'rgba(255,255,255,.55)',fontSize:11,letterSpacing:1,textTransform:'uppercase',marginBottom:4}}>Celkový zůstatek</p>
          <p style={{color:'#fff',fontSize:38,fontWeight:800,letterSpacing:-1,marginBottom:16}}>{balance.toLocaleString('cs-CZ')} Kč</p>
          <div style={{display:'flex',gap:16}}>
            {[['PŘÍJMY','+'+income.toLocaleString('cs-CZ')+' Kč',AC.main],['VÝDAJE','−'+expenses.toLocaleString('cs-CZ')+' Kč','#ff7b7b']].map(([l,v,c],i)=>(
              <React.Fragment key={i}>
                {i>0&&<div style={{width:1,background:'rgba(255,255,255,.15)'}}/>}
                <div><p style={{color:'rgba(255,255,255,.5)',fontSize:10}}>{l}</p><p style={{color:c,fontSize:15,fontWeight:700}}>{v}</p></div>
              </React.Fragment>
            ))}
          </div>
        </div>
      </div>

      {txns.length===0?(
        <EmptyState emoji="💳" title="Zatím žádné transakce" sub="Přidejte první příjem nebo výdaj a sledujte svůj finanční přehled." btnLabel="+ Přidat transakci" onAdd={()=>setShowAddTxn(true)}/>
      ):(
        <>
          {/* Quick stats */}

function ExpensesScreen({userData,setUserData,user,onTab}){
  const [showAdd,setShowAdd]=React.useState(false);
  const [month,setMonth]=React.useState(new Date().getMonth());
  const months=['Leden','Únor','Březen','Duben','Květen','Červen','Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];
  const txns=userData.transactions||[];

  const addTxn=(t)=>{
    const updated={...userData,transactions:[t,...txns]};
    setUserData(updated);
    LS.set(LS.key(user.email,'data'),updated);
    setShowAdd(false);
  };
  const deleteTxn=(i)=>{
    const updated={...userData,transactions:txns.filter((_,idx)=>idx!==i)};
    setUserData(updated);
    LS.set(LS.key(user.email,'data'),updated);
  };

  const totalExpenses=txns.filter(t=>t.amount<0).reduce((s,t)=>s+Math.abs(t.amount),0);
  const totalIncome=txns.filter(t=>t.amount>0).reduce((s,t)=>s+t.amount,0);

  return <div style={{height:'100%',display:'flex',flexDirection:'column',background:'#f7f9fc'}}>
    {showAdd&&<AddTxnModal onSave={addTxn} onClose={()=>setShowAdd(false)}/>}
    <div style={{flex:1,overflowY:'auto',WebkitOverflowScrolling:'touch',paddingBottom:20}}>
      <div style={{background:NAVY,padding:`${hPad} 24px 20px`}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
          <h2 style={{color:'#fff',fontSize:22,fontWeight:800}}>Výdaje</h2>
          <button onClick={()=>setShowAdd(true)} style={{background:AC.main,border:'none',borderRadius:12,padding:'8px 16px',fontSize:13,fontWeight:700,color:'#fff',cursor:'pointer',fontFamily:'inherit'}}>+ Přidat</button>
        </div>
        <div style={{display:'flex',gap:8,overflowX:'auto',paddingBottom:4}}>
          {months.map((m,i)=><button key={i} onClick={()=>setMonth(i)} style={{flexShrink:0,padding:'7px 14px',borderRadius:99,border:'none',cursor:'pointer',background:month===i?AC.main:'rgba(255,255,255,.12)',color:month===i?'#fff':'rgba(255,255,255,.6)',fontWeight:700,fontSize:12,fontFamily:'inherit'}}>{m}</button>)}
        </div>
      </div>

      {txns.length>0&&(
        <div style={{padding:'20px 20px 0'}}>
          <Card style={{padding:'18px'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12}}>
              <div>
                <p style={{fontSize:11,color:'#999',fontWeight:600,textTransform:'uppercase',letterSpacing:.5,marginBottom:4}}>Celkové výdaje</p>
                <p style={{fontSize:28,fontWeight:800,color:NAVY,letterSpacing:-.5}}>{totalExpenses.toLocaleString('cs-CZ')} Kč</p>
              </div>
              <div style={{background:AC.muted,borderRadius:10,padding:'6px 10px'}}>
                <p style={{fontSize:12,fontWeight:700,color:AC.main}}>+{totalIncome.toLocaleString('cs-CZ')} Kč</p>
                <p style={{fontSize:10,color:'#aaa',textAlign:'right'}}>příjmy</p>
              </div>
            </div>
            <PBar value={totalExpenses} max={Math.max(totalExpenses,totalIncome,1)} color={AC.main} height={8}/>
          </Card>
        </div>
      )}

      <div style={{padding:'16px 20px 0'}}>
        {txns.length===0?(
          <EmptyState emoji="🧾" title="Žádné transakce" sub="Začněte přidáváním příjmů a výdajů — uvidíte přehled svých financí." btnLabel="+ Přidat první transakci" onAdd={()=>setShowAdd(true)}/>
        ):(
          <>
            <h3 style={{fontSize:15,fontWeight:800,color:NAVY,marginBottom:12}}>Všechny transakce</h3>
            <Card style={{padding:0,overflow:'hidden'}}>
              {txns.map((t,i)=>(
                <div key={i} style={{display:'flex',alignItems:'center',padding:'12px 16px',gap:12,borderBottom:i<txns.length-1?'1px solid #f0f2f5':'none'}}>
                  <div style={{width:40,height:40,borderRadius:13,background:t.color+'18',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,flexShrink:0}}>{t.icon}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <p style={{fontSize:13,fontWeight:700,color:NAVY}}>{t.name}</p>
                    <p style={{fontSize:11,color:'#aaa'}}>{t.date?t.date+' · ':''}{t.cat}</p>
                  </div>
                  <p style={{fontSize:13,fontWeight:700,color:t.amount>0?AC.main:'#444',flexShrink:0}}>{t.amount>0?'+':''}{t.amount.toLocaleString('cs-CZ')} Kč</p>
                  <button onClick={()=>deleteTxn(i)} style={{background:'none',border:'none',color:'#ddd',fontSize:18,cursor:'pointer',padding:'0 0 0 4px',flexShrink:0}}>×</button>
                </div>
              ))}
            </Card>
          </>
        )}
      </div>
    </div>
    <TabBar active="expenses" onTab={onTab}/>
  </div>;
}

function BudgetScreen({userData,setUserData,user,onTab}){

        </div>
        {cats.length>0&&<div style={{background:'rgba(255,255,255,.1)',borderRadius:16,padding:'14px 16px'}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>

          <p style={{color:'rgba(255,255,255,.5)',fontSize:11,marginTop:6}}>{tb>0?Math.round(ts/tb*100):0}% z měsíčního rozpočtu</p>

        <EmptyState emoji="📊" title="Zatím žádné kategorie" sub="Přidejte kategorie rozpočtu — nastavte měsíční limity pro potraviny, bydlení, zábavu a další." btnLabel="+ Přidat kategorii" onAdd={()=>setShowAdd(true)}/>

        <div style={{padding:'20px 20px 0',display:'flex',flexDirection:'column',gap:10}}>
          {cats.map((c,i)=>{

                  <div style={{flex:1}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:2}}>
                      <span style={{fontSize:14,fontWeight:700,color:NAVY}}>{c.name}</span>
                      {over&&<span style={{fontSize:10,fontWeight:700,color:'#fff',background:'#e53935',borderRadius:6,padding:'2px 6px'}}>PŘEKROČENO</span>}
                    </div>
                    <span style={{fontSize:12,fontWeight:600,color:over?'#e53935':'#888'}}>{c.spent.toLocaleString('cs-CZ')} / {c.budget.toLocaleString('cs-CZ')} Kč</span>
                  </div>
                </div>
                <PBar value={c.spent} max={c.budget||1} color={over?'#e53935':c.color}/>
              </div>
              {open&&<div style={{borderTop:'1px solid #f0f2f5',padding:'12px 16px',background:'#fafbfc',display:'flex',gap:8,alignItems:'center'}}>
                {[['Zbývá',(c.budget-c.spent).toLocaleString('cs-CZ')+' Kč',over?'#e53935':AC.main],['Plnění',Math.round(Math.min(1,c.spent/(c.budget||1))*100)+' %',NAVY]].map(([l,v,cl],j)=>(
                  <React.Fragment key={j}>
                    {j>0&&<div style={{width:1,height:36,background:'#eee'}}/>}
                    <div style={{flex:1,textAlign:'center'}}><p style={{fontSize:11,color:'#bbb',marginBottom:2}}>{l}</p><p style={{fontSize:14,fontWeight:800,color:cl}}>{v}</p></div>
                  </React.Fragment>
                ))}
                <div style={{width:1,height:36,background:'#eee'}}/>
                <button onClick={(e)=>{e.stopPropagation();deleteBudget(i);}} style={{flex:1,textAlign:'center',background:'none',border:'none',cursor:'pointer',color:'#e53935',fontSize:12,fontWeight:700,fontFamily:'inherit'}}>🗑 Smazat</button>
              </div>}
            </Card>;
          })}
        </div>
      )}
    </div>
    <TabBar active="budget" onTab={onTab}/>
  </div>;
}

function AddAssetModal({onSave,onClose}){
  const [name,setName]=React.useState('');
  const [ticker,setTicker]=React.useState('');
  const [invested,setInvested]=React.useState('');
  const [current,setCurrent]=React.useState('');

  const save=()=>{

    const inv=parseFloat(invested.replace(/\s/g,'').replace(',','.'))||0;
    const cur=parseFloat(current.replace(/\s/g,'').replace(',','.'))||inv;
    onSave({name,ticker:ticker.toUpperCase(),invested:inv,current:cur,type:type.id,icon:type.icon,color:type.color,label:type.label,note,date:new Date().toLocaleDateString('cs-CZ')});

      </div>
      <div>
        <label style={{fontSize:12,fontWeight:600,color:'#888',display:'block',marginBottom:8,textTransform:'uppercase',letterSpacing:.5}}>Typ investice</label>
        <div style={{display:'flex',flexWrap:'wrap',gap:7}}>
          {PORT_TYPES.map(t=>(
            <button key={t.id} onClick={()=>setType(t)} style={{display:'flex',alignItems:'center',gap:5,padding:'7px 11px',borderRadius:99,border:`2px solid ${type.id===t.id?t.color:'#e8ecf2'}`,background:type.id===t.id?t.color+'18':'#fff',fontSize:12,fontWeight:600,color:type.id===t.id?t.color:NAVY,cursor:'pointer',fontFamily:'inherit'}}>

      <Btn onClick={save} disabled={!name||!invested} style={{width:'100%'}}>Přidat investici</Btn>
    </div>
  </div>;
}

function EditAssetModal({asset,idx,onSave,onClose}){
  const [current,setCurrent]=React.useState(String(asset.current));
  const [note,setNote]=React.useState(asset.note||'');
  const save=()=>{const cur=parseFloat(current.replace(/\s/g,'').replace(',','.'))||0;onSave(idx,{...asset,current:cur,note});};
  const gain=parseFloat(current.replace(/\s/g,'').replace(',','.'))-asset.invested;
  const gainPct=asset.invested>0?Math.round((gain/asset.invested)*100):0;
  return <div style={{position:'fixed',inset:0,zIndex:200,display:'flex',flexDirection:'column',justifyContent:'flex-end'}}>
    <div onClick={onClose} style={{position:'absolute',inset:0,background:'rgba(0,0,0,.5)'}}/>

      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div style={{display:'flex',gap:10,alignItems:'center'}}>
          <span style={{fontSize:28}}>{asset.icon}</span>
          <div><p style={{fontSize:15,fontWeight:800,color:NAVY}}>{asset.name}</p><p style={{fontSize:12,color:'#aaa'}}>{asset.label}</p></div>
        </div>
        <button onClick={onClose} style={{background:'#eee',border:'none',borderRadius:99,width:32,height:32,fontSize:18,cursor:'pointer'}}>×</button>
      </div>
      <div style={{background:'#f0f2f5',borderRadius:14,padding:'12px 16px',display:'flex',gap:20}}>
        <div><p style={{fontSize:11,color:'#aaa',marginBottom:2}}>Vloženo</p><p style={{fontSize:15,fontWeight:800,color:NAVY}}>{asset.invested.toLocaleString('cs-CZ')} Kč</p></div>
        <div><p style={{fontSize:11,color:'#aaa',marginBottom:2}}>Zisk/ztráta</p><p style={{fontSize:15,fontWeight:800,color:gain>=0?AC.main:'#e53935'}}>{gain>=0?'+':''}{Math.round(gain).toLocaleString('cs-CZ')} Kč ({gainPct>=0?'+':''}{gainPct}%)</p></div>
      </div>
      <Input label="Aktuální hodnota (Kč)" value={current} onChange={setCurrent} type="text" placeholder="10 000"/>

}

  const saveData=(newAssets)=>{
    const updated={...userData,portfolio:newAssets};
    setUserData(updated);
    if(user) LS.set(LS.key(user.email,'data'),updated);
  };
  const addAsset=(a)=>{saveData([...assets,a]);setShowAdd(false);};
  const updateAsset=(idx,a)=>{const n=[...assets];n[idx]=a;saveData(n);setEditItem(null);};
  const deleteAsset=(idx)=>saveData(assets.filter((_,i)=>i!==idx));

  const totalInvested=assets.reduce((s,a)=>s+a.invested,0);
  const totalCurrent=assets.reduce((s,a)=>s+a.current,0);
  const totalGain=totalCurrent-totalInvested;

  const byType=PORT_TYPES.map(t=>{const val=assets.filter(a=>a.type===t.id).reduce((s,a)=>s+a.current,0);return {...t,value:val};}).filter(t=>t.value>0);

  const r=52,circ=2*Math.PI*r;let offD=0;
  const segs=byType.map(t=>{const p=t.value/total2;const sg={...t,off:offD,dash:p*circ,gap:(1-p)*circ};offD+=p;return sg;});
  const alerts=assets.filter(a=>a.invested>0&&((a.current-a.invested)/a.invested)*100<-10);

  if(assets.length===0) return <div style={{height:'100%',display:'flex',flexDirection:'column',background:'#f7f9fc'}}>

      <div style={{background:`linear-gradient(135deg,${NAVY},#1a3a6b)`,padding:`${hPad} 24px 24px`,position:'relative',overflow:'hidden'}}>
        <div style={{position:'absolute',top:-30,right:-30,width:140,height:140,borderRadius:'50%',background:'rgba(255,255,255,.04)'}}/>

          <button onClick={()=>setShowAdd(true)} style={{background:AC.main,border:'none',borderRadius:13,padding:'9px 16px',fontSize:13,fontWeight:700,color:'#fff',cursor:'pointer',fontFamily:'inherit'}}>+ Přidat</button>
        </div>

            <div><p style={{color:'rgba(255,255,255,.5)',fontSize:10}}>ZISK / ZTRÁTA</p><p style={{color:totalGain>=0?AC.main:'#ff7b7b',fontSize:14,fontWeight:700}}>{totalGain>=0?'+':''}{Math.round(totalGain).toLocaleString('cs-CZ')} Kč ({totalGainPct>=0?'+':''}{totalGainPct}%)</p></div>

              </div>
            </div>
            {a.note&&<p style={{fontSize:11,color:'#bbb',marginTop:8,fontStyle:'italic'}}>💬 {a.note}</p>}
          </Card>;
        })}
      </div>}
      {view==='alerts'&&<div style={{padding:'18px 18px 0',display:'flex',flexDirection:'column',gap:12}}>
        {alerts.length===0?<EmptyState emoji="✅" title="Žádné alerty" sub="Všechny vaše investice jsou v pořádku. Alerty se zobrazí při poklesu o více než 10 %." onAdd={null}/>:(

          {alerts.map((a,i)=>{const gain=a.current-a.invested,gp=a.invested>0?Math.round((gain/a.invested)*100):0;return(

              <div style={{display:'flex',gap:12,alignItems:'center'}}>

      </div>}
    </div>
    <TabBar active="portfolio" onTab={onTab}/>
  </div>;
}

const GOAL_COLORS=['#1DB97A','#4f8cff','#9b6dff','#f5a623','#e53935','#26c6da','#ec407a','#ff7043'];
const GOAL_EMOJIS=['🏖️','🚗','🛡️','🏠','💻','✈️','🎓','💍','🎸','⛵','🏋️','🌍'];

function AddGoalModal({onSave,onClose}){
  const [name,setName]=React.useState('');
  const [emoji,setEmoji]=React.useState('🏖️');
  const [target,setTarget]=React.useState('');
  const [current,setCurrent]=React.useState('');
  const [monthly,setMonthly]=React.useState('');
  const [deadline,setDeadline]=React.useState('');
  const [color,setColor]=React.useState(GOAL_COLORS[0]);

  const save=()=>{
    if(!name||!target) return;
    const t=parseInt(target.replace(/\s/g,''))||0;
    const c=parseInt(current.replace(/\s/g,''))||0;
    const m=parseInt(monthly.replace(/\s/g,''))||0;
    const pct25=Math.round(t*0.25),pct50=Math.round(t*0.5),pct75=Math.round(t*0.75);
    onSave({
      name,emoji,target:t,current:c,deadline:deadline||'Bez termínu',monthly:m,color,
      ms:[{l:'25 %',a:pct25,d:c>=pct25},{l:'50 %',a:pct50,d:c>=pct50},{l:'75 %',a:pct75,d:c>=pct75},{l:'Cíl',a:t,d:c>=t}]
    });
  };

  return(
    <div style={{position:'fixed',inset:0,zIndex:200,display:'flex',flexDirection:'column',justifyContent:'flex-end'}}>
      <div onClick={onClose} style={{position:'absolute',inset:0,background:'rgba(0,0,0,.5)'}}/>
      <div style={{position:'relative',background:'#f7f9fc',borderRadius:'24px 24px 0 0',padding:`20px 20px calc(${safeBot}+20px)`,display:'flex',flexDirection:'column',gap:14,maxHeight:'85vh',overflowY:'auto',WebkitOverflowScrolling:'touch'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
          <h3 style={{fontSize:18,fontWeight:800,color:NAVY}}>Nový cíl spoření</h3>
          <button onClick={onClose} style={{background:'#eee',border:'none',borderRadius:99,width:32,height:32,fontSize:18,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>×</button>
        </div>
        {/* Emoji picker */}
        <div>
          <label style={{fontSize:12,fontWeight:600,color:'#888',display:'block',marginBottom:8,textTransform:'uppercase',letterSpacing:.5}}>Ikona</label>
          <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
            {GOAL_EMOJIS.map(e=><button key={e} onClick={()=>setEmoji(e)} style={{width:42,height:42,borderRadius:12,border:`2px solid ${emoji===e?AC.main:'#e8ecf2'}`,background:emoji===e?AC.muted:'#fff',fontSize:20,cursor:'pointer'}}>{e}</button>)}
          </div>
        </div>
        <Input label="Název cíle" value={name} onChange={setName} placeholder="Dovolená v Thajsku"/>
        <Input label="Cílová částka (Kč)" value={target} onChange={setTarget} type="text" placeholder="100 000"/>
        <Input label="Naspořeno (Kč)" value={current} onChange={setCurrent} type="text" placeholder="0"/>
        <Input label="Měsíční úložka (Kč)" value={monthly} onChange={setMonthly} type="text" placeholder="3 000"/>
        <Input label="Termín (nepovinné)" value={deadline} onChange={setDeadline} placeholder="Prosinec 2026"/>
        {/* Color picker */}
        <div>
          <label style={{fontSize:12,fontWeight:600,color:'#888',display:'block',marginBottom:8,textTransform:'uppercase',letterSpacing:.5}}>Barva</label>
          <div style={{display:'flex',gap:8}}>
            {GOAL_COLORS.map(c=><button key={c} onClick={()=>setColor(c)} style={{width:34,height:34,borderRadius:99,background:c,border:`3px solid ${color===c?NAVY:'transparent'}`,cursor:'pointer'}}/>)}
          </div>
        </div>
        <Btn onClick={save} disabled={!name||!target} style={{width:'100%',marginTop:4}}>Přidat cíl →</Btn>
      </div>
    </div>
  );
}

function SavingsScreen({user,userData,setUserData,onTab}){
  const [active,setActive]=React.useState(0);
  const [showAdd,setShowAdd]=React.useState(false);
  const goals=userData.goals||[];

  const addGoal=(g)=>{
    const updated={...userData,goals:[...goals,g]};
    setUserData(updated);
    if(user) LS.set(LS.key(user.email,'data'),updated);
    setActive(goals.length);
    setShowAdd(false);
  };
  const addSaving=(amount)=>{
    const updated=goals.map((g,i)=>i===active?{...g,current:Math.min(g.target,g.current+amount),ms:g.ms.map(m=>({...m,d:g.current+amount>=m.a}))}:g);
    const newData={...userData,goals:updated};
    setUserData(newData);
    if(user) LS.set(LS.key(user.email,'data'),newData);
  };

  const g=goals.length>0?goals[Math.min(active,goals.length-1)]:null;
  const pct=g?g.current/g.target:0,r=52,circ=2*Math.PI*r;

  if(goals.length===0) return <div style={{height:'100%',display:'flex',flexDirection:'column',background:'#f7f9fc'}}>

    <TabBar active="savings" onTab={onTab}/>
  </div>;
  return <div style={{height:'100%',display:'flex',flexDirection:'column',background:'#f7f9fc'}}>
    {showAdd&&<AddGoalModal onSave={addGoal} onClose={()=>setShowAdd(false)}/>}
    <div style={{flex:1,overflowY:'auto',WebkitOverflowScrolling:'touch',paddingBottom:20}}>
      <div style={{background:NAVY,padding:`${hPad} 24px 20px`}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:4}}>
          <div>
            <h2 style={{color:'#fff',fontSize:22,fontWeight:800,marginBottom:2}}>Cíle spoření</h2>

function AkademieScreen({user,quizProgress,onQuizDone}){

          <p style={{fontSize:28,marginBottom:8}}>🎯</p>
          <p style={{fontSize:16,fontWeight:800,color:'#fff',marginBottom:6}}>Otestujte své znalosti</p>
          <p style={{fontSize:13,color:'rgba(255,255,255,.75)',marginBottom:16}}>{ch.quiz.length} otázek · Kvíz zabere ~2 minuty</p>
          {prog&&<p style={{fontSize:13,color:'rgba(255,255,255,.9)',marginBottom:12}}>Váš poslední výsledek: {prog.score}/{prog.total} ({Math.round(prog.score/prog.total*100)}%)</p>}
          <Btn onClick={startQuiz} style={{width:'100%',background:'#fff',color:ch.color}}>{prog?'Zopakovat kvíz':'Spustit kvíz →'}</Btn>
        </div>
      </div>
      <div style={{padding:'10px 18px',background:'#f7f9fc',borderTop:'1px solid #eee',flexShrink:0}}>
        <button onClick={()=>setView('list')} style={{background:'none',border:'none',color:'#888',fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:4}}>← Zpět na přehled</button>
      </div>
    </div>
  );

  if(view==='quiz') return(
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      <div style={{flex:1,overflowY:'auto',WebkitOverflowScrolling:'touch',padding:'18px 18px 20px',display:'flex',flexDirection:'column',gap:16}}>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <div style={{fontSize:28}}>{ch.emoji}</div>
          <div>
            <p style={{fontSize:13,fontWeight:800,color:NAVY}}>{ch.title}</p>
            <p style={{fontSize:12,color:'#aaa'}}>{Object.keys(quizAnswers).length} / {ch.quiz.length} zodpovězeno</p>
          </div>
        </div>
        <PBar value={Object.keys(quizAnswers).length} max={ch.quiz.length} color={ch.color} height={6}/>
        {ch.quiz.map((q,qi)=>(
          <div key={qi} style={{background:'#fff',borderRadius:18,padding:'18px',boxShadow:'0 2px 8px rgba(0,0,0,.05)'}}>
            <p style={{fontSize:14,fontWeight:700,color:NAVY,marginBottom:14,lineHeight:1.4}}>
              <span style={{color:ch.color,fontWeight:800}}>{qi+1}. </span>{q.q}
            </p>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {q.opts.map((opt,oi)=>{
                const sel=quizAnswers[qi]===oi;
                return <button key={oi} onClick={()=>setQuizAnswers(a=>({...a,[qi]:oi}))} style={{
                  padding:'12px 16px',borderRadius:13,border:`2px solid ${sel?ch.color:'#e8ecf2'}`,
                  background:sel?ch.color+'18':'#fff',color:sel?ch.color:NAVY,
                  fontWeight:sel?700:500,fontSize:13,textAlign:'left',cursor:'pointer',
                  fontFamily:'inherit',transition:'all .15s',
                }}>{opt}</button>;
              })}
            </div>
          </div>
        ))}
        <Btn onClick={submitQuiz} disabled={Object.keys(quizAnswers).length<ch.quiz.length} style={{width:'100%',background:ch.color,boxShadow:`0 8px 24px ${ch.color}40`}}>
          Odeslat odpovědi {Object.keys(quizAnswers).length<ch.quiz.length?`(${Object.keys(quizAnswers).length}/${ch.quiz.length})`:''}
        </Btn>
      </div>
      <div style={{padding:'10px 18px',background:'#f7f9fc',borderTop:'1px solid #eee',flexShrink:0}}>
        <button onClick={()=>setView('chapter')} style={{background:'none',border:'none',color:'#888',fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>← Zpět na kapitolu</button>
      </div>
    </div>
  );

  if(view==='result'){
    const pct=Math.round(score/ch.quiz.length*100);
    const passed=pct>=60;
    return <div style={{flex:1,overflowY:'auto',WebkitOverflowScrolling:'touch',padding:'18px',display:'flex',flexDirection:'column',gap:16,animation:'pop .3s ease'}}>
      <div style={{background:passed?ch.color:'#e53935',borderRadius:24,padding:'28px 24px',textAlign:'center'}}>
        <div style={{fontSize:60,marginBottom:12}}>{pct===100?'🏆':pct>=80?'🎉':pct>=60?'👍':'📚'}</div>
        <p style={{fontSize:38,fontWeight:800,color:'#fff',marginBottom:4}}>{pct}%</p>
        <p style={{fontSize:16,fontWeight:700,color:'rgba(255,255,255,.9)',marginBottom:8}}>{score} z {ch.quiz.length} správně</p>
        <p style={{fontSize:14,color:'rgba(255,255,255,.75)'}}>{pct===100?'Perfektní výsledek!':pct>=80?'Výborně!':pct>=60?'Dobrá práce!':'Zkuste to znovu'}</p>
      </div>
      {/* Answers review */}
      <h3 style={{fontSize:15,fontWeight:800,color:NAVY}}>Přehled odpovědí</h3>
      {ch.quiz.map((q,qi)=>{
        const correct=quizAnswers[qi]===q.correct;
        return <div key={qi} style={{background:'#fff',borderRadius:16,padding:'14px 16px',boxShadow:'0 1px 6px rgba(0,0,0,.05)',border:`1px solid ${correct?'#1DB97A33':'#ff000033'}`}}>
          <div style={{display:'flex',gap:10,alignItems:'flex-start',marginBottom:8}}>
            <span style={{fontSize:16}}>{correct?'✅':'❌'}</span>
            <p style={{fontSize:13,fontWeight:600,color:NAVY,lineHeight:1.4}}>{q.q}</p>
          </div>
          <p style={{fontSize:12,color:'#1DB97A',fontWeight:600,paddingLeft:26}}>✓ {q.opts[q.correct]}</p>
          {!correct&&<p style={{fontSize:12,color:'#e53935',paddingLeft:26,marginTop:2}}>Vaše odpověď: {q.opts[quizAnswers[qi]]||'—'}</p>}
        </div>;
      })}
      <div style={{display:'flex',gap:10}}>
        <Btn onClick={()=>setView('list')} variant="secondary" style={{flex:1}}>← Kapitoly</Btn>
        <Btn onClick={startQuiz} style={{flex:1,background:ch.color}}>Zopakovat</Btn>
      </div>
    </div>;
  }
}

// AI PORADCE — opravená verze
// ══════════════════════════════════════════════════════════════
function AIAdvisor({userData}){
  const [msgs,setMsgs]=React.useState([
    {role:'assistant',text:'Ahoj! Jsem váš AI finanční poradce 🤖\n\nZeptejte se mě na cokoliv — rozpočty, spoření, investice, ETF, portfolio nebo finanční plánování. Odpovídám česky.\n\n⚠️ Sloužím ke vzdělávání, neposkytuju investiční doporučení.'}
  ]);
  const [input,setInput]=React.useState('');
  const [loading,setLoading]=React.useState(false);
  const endRef=React.useRef(null);
  const quick=['Jak začít investovat?','Co je ETF fond?','Pravidlo 50/30/20','Jak vytvořit rezervu?','Co je DCA strategie?','Aktivní vs. pasivní investování','Jak diverzifikovat portfolio?','Co je FIRE hnutí?'];

  React.useEffect(()=>{if(endRef.current)endRef.current.parentElement.scrollTop=endRef.current.offsetTop;},[msgs,loading]);

  const portfolioCtx=()=>{
    const assets=userData?.portfolio||[];
    if(assets.length===0) return '';
    const total=assets.reduce((s,a)=>s+a.current,0);
    const invested=assets.reduce((s,a)=>s+a.invested,0);
    return `\n\nKontext portfolia uživatele: ${assets.length} pozic, celková hodnota ${total.toLocaleString('cs-CZ')} Kč, vloženo ${invested.toLocaleString('cs-CZ')} Kč, pozice: ${assets.map(a=>`${a.name} (${a.current.toLocaleString('cs-CZ')} Kč)`).join(', ')}.`;
  };

const SYSTEM=`Jsi přátelský AI finanční poradce v české mobilní aplikaci "Osobní finance". Odpovídáš VŽDY výhradně česky. Zaměřuješ se na: osobní finance, spoření, investice (ETF, akcie, dluhopisy, komodity), rozpočtování, finanční plánování, portfolio management, FIRE hnutí a psychologii peněz. Odpovídej PODROBNĚ a vyčerpávajícím způsobem - vysvětli kontext, principy, uveď konkrétní příklady s čísly v Kč, popiš výhody i rizika, a doporuč další kroky. U jednoduchých otázek 200-400 slov, u komplexních témat klidně 600-1000 slov. Používej odstavce a odrážky pro přehlednost. Na konci každé odpovědi uveď: "⚠️ Toto je vzdělávací obsah, nejedná se o investiční doporučení."`;
   
    if(typeof window.claude?.complete==='function'){
      return await window.claude.complete({messages,system});
    }
    // 2) Zkus /api/chat (Vercel deployment)
    const r=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages,system}),
    });
    if(!r.ok){const e=await r.json();throw new Error(e.error||'API chyba');}
    const d=await r.json();
    return d.text;
  };

  const send=async(text)=>{
    const q=(text||input).trim();
    if(!q||loading) return;
    setInput('');
    setMsgs(p=>[...p,{role:'user',text:q}]);
    setLoading(true);
 
    try{
      const history=msgs.slice(-12).map(m=>({role:m.role==='assistant'?'assistant':'user',content:m.text}));
      const reply=await callAI(
        [...history,{role:'user',content:q}],
        SYSTEM+portfolioCtx()
      );
      setMsgs(p=>[...p,{role:'assistant',text:reply}]);
      setLoading(false);
      return;
    }catch(e){
      // fallback
    }

    // Offline fallback odpovědi
    const fallbacks={
      'etf':'ETF (Exchange Traded Fund) je fond obchodovaný na burze, který kopíruje index. Výhody: okamžitá diverzifikace, nízké poplatky (0,03–0,2 % ročně), jednoduchost. Populární ETF: Vanguard FTSE All-World (VWCE), iShares Core S&P 500 (CSSP).\n\n⚠️ Není investiční doporučení.',
      'dca':'DCA (Dollar-Cost Averaging) je strategie pravidelného investování stejné částky bez ohledu na cenu. Kupujete více podílů při nízkých cenách a méně při vysokých. Výsledkem je průměrná nákupní cena. Ideální pro začátečníky.\n\n⚠️ Není investiční doporučení.',
      '50':'Pravidlo 50/30/20 rozděluje příjem: 50 % na nutné výdaje (bydlení, jídlo, doprava), 30 % na přání (restaurace, zábava, cestování), 20 % na spoření a splácení dluhů. Příklad při 50 000 Kč: 25 000 / 15 000 / 10 000 Kč.',
      'rezerv':'Finanční rezerva by měla mít 3–6 měsíčních výdajů. Uložte ji na spořicí účet — ne v investicích. Při výdajích 25 000 Kč/měsíc = 75 000–150 000 Kč rezerva.\n\n⚠️ Není investiční doporučení.',
      'investovat':'Začněte v 5 krocích: 1) Vytvořte finanční rezervu (3–6 měsíců výdajů), 2) Zvolte brokera (XTB, Degiro, Interactive Brokers), 3) Začněte s ETF indexovými fondy, 4) Investujte pravidelně (DCA), 5) Nevybírejte při poklesu.\n\n⚠️ Není investiční doporučení.',
      'fire':'FIRE (Financial Independence, Retire Early) = finanční nezávislost, brzy do důchodu. Pravidlo 4 %: naspořte 25× roční výdaje. Při výdajích 400 000 Kč/rok = 10 mil. Kč cíl.\n\n⚠️ Není investiční doporučení.',
      'diverzif':'Diverzifikace = rozložení investic do více aktiv. ETF indexový fond obsahuje tisíce akcií v jednom. Diverzifikujte napříč: zeměmi (USA, Evropa, Asie), třídami aktiv (akcie, dluhopisy, zlato), sektory.\n\n⚠️ Není investiční doporučení.',
      'pasivn':'Pasivní investování kopíruje index (S&P 500, MSCI World) přes ETF. 90 % aktivních fondů nepřekoná index v dlouhodobém horizontu. Pasivní investování je pro většinu lidí lepší volbou.\n\n⚠️ Není investiční doporučení.',
      'portfolio':'Portfolio je souhrn vašich investic. Dobré portfolio je diverzifikované — obsahuje různé typy aktiv (ETF, dluhopisy, zlato). Doporučené složení pro začátečníka: 80 % globální ETF + 20 % dluhopisy.\n\n⚠️ Není investiční doporučení.',
      'broker':'Populární čeští brokeři: XTB (bez poplatků do 100 000 EUR/měsíc), Degiro (nízké poplatky), Interactive Brokers (pokročilí). Pro ETF je ideální XTB nebo Degiro. Vždy zkontrolujte regulaci (ČNB, FCA).\n\n⚠️ Není investiční doporučení.',
    };
    const qLow=q.toLowerCase();
    const key=Object.keys(fallbacks).find(k=>qLow.includes(k));
    setTimeout(()=>{
      if(key){
        setMsgs(p=>[...p,{role:'assistant',text:fallbacks[key]}]);
      } else {
        setMsgs(p=>[...p,{role:'assistant',text:'Pro plný AI chat otevřete aplikaci přes online odkaz (ne stažený soubor).\n\nNejčastější témata: ETF, DCA, rezerva, pravidlo 50/30/20, FIRE, portfolio, broker, diverzifikace, pasivní investování.\n\n⚠️ Není investiční doporučení.'}]);
      }
      setLoading(false);
    },600);
  };

  const isOnline=typeof window.claude?.complete==='function' || window.location.protocol==='https:';

  return <div style={{display:'flex',flexDirection:'column',height:'100%',background:'#f7f9fc'}}>
    <div style={{background:isOnline?AC.main:'#f5a623',padding:'8px 16px',flexShrink:0,display:'flex',alignItems:'center',gap:8}}>
      <div style={{width:8,height:8,borderRadius:'50%',background:'#fff',flexShrink:0}}/>
      <p style={{fontSize:12,color:'#fff',fontWeight:700}}>{isOnline?'AI online — plné odpovědi aktivní':'Offline režim — základní odpovědi. Pro plný AI použijte online odkaz.'}</p>
    </div>
    <div style={{flex:1,overflowY:'auto',WebkitOverflowScrolling:'touch',padding:'16px 16px 0'}}>
      {msgs.length<=1&&<div style={{marginBottom:16}}>
        <p style={{fontSize:11,color:'#bbb',fontWeight:600,textTransform:'uppercase',letterSpacing:.5,marginBottom:8}}>Rychlé otázky</p>
        <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
          {quick.map((q,i)=><button key={i} onClick={()=>send(q)} style={{background:AC.muted,border:`1px solid ${AC.main}33`,borderRadius:99,padding:'7px 13px',fontSize:12,fontWeight:600,color:AC.main,cursor:'pointer',fontFamily:'inherit'}}>{q}</button>)}
        </div>
      </div>}
      {msgs.map((m,i)=>(
        <div key={i} style={{display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start',marginBottom:12,animation:'fadeIn .2s ease'}}>
          {m.role==='assistant'&&<div style={{width:30,height:30,borderRadius:99,background:AC.main,display:'flex',alignItems:'center',justifyContent:'center',fontSize:15,marginRight:8,flexShrink:0,alignSelf:'flex-end'}}>🤖</div>}
          <div style={{maxWidth:'78%',background:m.role==='user'?AC.main:'#fff',color:m.role==='user'?'#fff':NAVY,borderRadius:m.role==='user'?'18px 18px 4px 18px':'18px 18px 18px 4px',padding:'11px 14px',fontSize:13,lineHeight:1.6,boxShadow:'0 1px 6px rgba(0,0,0,.07)',whiteSpace:'pre-wrap'}}>{m.text}</div>
        </div>
      ))}
      {loading&&<div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
        <div style={{width:30,height:30,borderRadius:99,background:AC.main,display:'flex',alignItems:'center',justifyContent:'center',fontSize:15}}>🤖</div>
        <div style={{background:'#fff',borderRadius:'18px 18px 18px 4px',padding:'12px 16px',boxShadow:'0 1px 6px rgba(0,0,0,.07)'}}>
          <div style={{display:'flex',gap:5,alignItems:'center'}}>
            {[0,1,2].map(j=><div key={j} style={{width:7,height:7,borderRadius:'50%',background:AC.main,animation:`bounce 1.2s ease-in-out ${j*.2}s infinite`}}/>)}
          </div>
        </div>
      </div>}
      <div ref={endRef} style={{height:8}}/>
    </div>
    <div style={{padding:`10px 14px calc(${safeBot}+10px)`,background:'#fff',borderTop:'1px solid #eee',flexShrink:0}}>
      <div style={{display:'flex',gap:8,alignItems:'flex-end'}}>
        <textarea value={input} onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}}
          placeholder="Zeptejte se na cokoliv o financích…" rows={1}
          style={{flex:1,border:`1.5px solid ${input?AC.main:'#e0e4ed'}`,borderRadius:14,padding:'11px 14px',fontSize:14,fontFamily:'inherit',resize:'none',outline:'none',lineHeight:1.4,background:'#fff',color:NAVY,transition:'border-color .2s'}}
        />
        <button onClick={()=>send()} disabled={!input.trim()||loading} style={{width:44,height:44,borderRadius:13,border:'none',background:input.trim()&&!loading?AC.main:'#e0e4ed',cursor:input.trim()&&!loading?'pointer':'default',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,transition:'background .2s'}}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </button>
      </div>
      <p style={{fontSize:10,color:'#ccc',textAlign:'center',marginTop:5}}>Vzdělávací účely. Není investičním poradenstvím.</p>
    </div>
  </div>;
}

// ══════════════════════════════════════════════════════════════
// APP ROOT
// ══════════════════════════════════════════════════════════════
function App(){
  const [screen,setScreen]=React.useState(()=>{
    const session=LS.get('of_session');
    if(session) return 'app';
    const seen=LS.get('of_onboarded');
    return seen?'auth':'onboarding';
  });
  const [user,setUser]=React.useState(()=>LS.get('of_session'));
  const [tab,setTab]=React.useState(()=>LS.get('of_last_tab','dash'));

  // Per-user data
  const [userData,setUserData]=React.useState(()=>{
    if(!LS.get('of_session')) return {};
    const u=LS.get('of_session');
    return LS.get(LS.key(u.email,'data'),{});
  });
  const [quizProgress,setQuizProgress]=React.useState(()=>{
    if(!LS.get('of_session')) return {};
    const u=LS.get('of_session');
    return LS.get(LS.key(u.email,'quizzes'),{});
  });

  const handleLogin=(u)=>{
    setUser(u);
    const data=LS.get(LS.key(u.email,'data'),{});
    const quizzes=LS.get(LS.key(u.email,'quizzes'),{});
    setUserData(data);
    setQuizProgress(quizzes);
    setScreen('app');
  };

  const handleLogout=()=>{
    LS.set('of_session',null);
    setUser(null);
    setScreen('auth');
  };

  const handleQuizDone=(chId,score,total)=>{
    const updated={...quizProgress,[chId]:{score,total,date:new Date().toLocaleDateString('cs-CZ')}};
    setQuizProgress(updated);
    LS.set(LS.key(user.email,'quizzes'),updated);
  };

  const goTab=(t)=>{
    setTab(t);
    LS.set('of_last_tab',t);
  };

  if(screen==='onboarding') return <OnboardingScreen onDone={()=>{LS.set('of_onboarded',true);setScreen('auth');}}/>;
  if(screen==='auth'||!user) return <AuthScreen onLogin={handleLogin}/>;

  return <div style={{height:'100%',display:'flex',flexDirection:'column',background:'#f7f9fc'}}>
    {tab==='dash'&&<DashboardScreen user={user} userData={userData} setUserData={setUserData} onTab={goTab}/>}
    {tab==='expenses'&&<ExpensesScreen userData={userData} setUserData={setUserData} user={user} onTab={goTab}/>}
    {tab==='budget'&&<BudgetScreen userData={userData} setUserData={setUserData} user={user} onTab={goTab}/>}
    {tab==='portfolio'&&<PortfolioScreen user={user} userData={userData} setUserData={setUserData} onTab={goTab}/>}
    {tab==='savings'&&<SavingsScreen user={user} userData={userData} setUserData={setUserData} onTab={goTab}/>}
    {tab==='learn'&&<LearnScreen user={user} userData={userData} quizProgress={quizProgress} onQuizDone={handleQuizDone} onTab={goTab}/>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
